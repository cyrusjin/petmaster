<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>店铺管理 · 宠大师 PetMaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="icon" href="../assets/card/card-pets.png" type="image/png" />
</head>
<body class="admin-page">
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="admin-header">
    <div class="container admin-header-inner">
      <a class="admin-brand" href="../index.html">
        <img src="../assets/card/card-pets.png" alt="宠大师" />
        <span>
          <strong>宠大师管理后台</strong>
          <small>店铺管理</small>
        </span>
      </a>
      <div class="admin-user">
        <span id="admin-user"></span>
        <button class="btn btn-outline btn-sm" id="logout-btn" type="button">退出登录</button>
      </div>
    </div>
  </header>

  <nav class="admin-nav">
    <div class="container admin-nav-inner">
      <a class="admin-nav-link" href="index.html">入驻审核</a>
      <a class="admin-nav-link active" href="stores.html">店铺管理</a>
    </div>
  </nav>

  <main class="admin-main">
    <div class="container admin-panel admin-panel-wide">
      <div class="admin-toolbar">
        <div>
          <h1>店铺管理</h1>
          <p>查看已申请店铺，支持关闭与重新开通</p>
        </div>
        <button class="btn btn-outline btn-sm" id="refresh-btn" type="button">刷新</button>
      </div>

      <div class="admin-filters card">
        <label class="admin-filter">
          <span>状态</span>
          <select id="status-filter">
            <option value="">全部</option>
            <option value="pending">待审核</option>
            <option value="approved">已开通</option>
            <option value="disabled">已关闭</option>
            <option value="rejected">已拒绝</option>
          </select>
        </label>
        <label class="admin-filter admin-filter-grow">
          <span>搜索</span>
          <input id="keyword-input" type="search" placeholder="店铺名称、编号、电话、负责人" />
        </label>
        <button class="btn btn-primary btn-sm" id="search-btn" type="button">搜索</button>
      </div>

      <div id="summary" class="admin-summary"></div>
      <div id="content">
        <div class="card admin-loading">加载中...</div>
      </div>
    </div>
  </main>

  <script src="admin.js"></script>
  <script>
    if (!PetAdmin.requireAuth()) {
      throw new Error('redirect');
    }

    const STATUS_LABELS = {
      pending: '待审核',
      approved: '已开通',
      disabled: '已关闭',
      rejected: '已拒绝'
    };

    const STATUS_CLASS = {
      pending: 'status-pending',
      approved: 'status-approved',
      disabled: 'status-disabled',
      rejected: 'status-rejected'
    };

    const contentEl = document.getElementById('content');
    const summaryEl = document.getElementById('summary');
    const adminUserEl = document.getElementById('admin-user');
    const statusFilterEl = document.getElementById('status-filter');
    const keywordInputEl = document.getElementById('keyword-input');
    let processingId = '';

    adminUserEl.textContent = PetAdmin.getUsername();

    document.getElementById('logout-btn').addEventListener('click', function () {
      PetAdmin.clearSession();
      window.location.href = 'login.html';
    });

    document.getElementById('refresh-btn').addEventListener('click', loadStores);
    document.getElementById('search-btn').addEventListener('click', loadStores);
    keywordInputEl.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') loadStores();
    });

    function renderStores(stores, total) {
      summaryEl.textContent = '共 ' + total + ' 家店铺，当前显示 ' + stores.length + ' 条';

      if (!stores.length) {
        contentEl.innerHTML = '<div class="card admin-empty"><strong>暂无店铺</strong><span>调整筛选条件后重试</span></div>';
        return;
      }

      contentEl.innerHTML = [
        '<div class="store-table-wrap card">',
        '<table class="store-table">',
        '<thead><tr>',
        '<th>店铺</th>',
        '<th>负责人</th>',
        '<th>联系电话</th>',
        '<th>入驻状态</th>',
        '<th>营业状态</th>',
        '<th>更新时间</th>',
        '<th>操作</th>',
        '</tr></thead>',
        '<tbody>',
        stores.map(renderStoreRow).join(''),
        '</tbody></table></div>'
      ].join('');

      contentEl.querySelectorAll('[data-action]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const storeId = btn.getAttribute('data-id');
          const action = btn.getAttribute('data-action');
          if (!storeId || !action || processingId) return;
          if (action === 'disable') {
            const reason = window.prompt('请输入关闭原因（可选）', '店铺已被平台关闭，如有疑问请联系客服');
            if (reason === null) return;
            updateAccess(storeId, 'disable', reason);
            return;
          }
          if (action === 'enable') {
            if (!window.confirm('确定重新开通该店铺？商家端权限将恢复。')) return;
            updateAccess(storeId, 'enable');
          }
        });
      });
    }

    function renderStoreRow(item) {
      const status = item.merchantApplyStatus || '';
      const statusLabel = STATUS_LABELS[status] || status || '--';
      const statusClass = STATUS_CLASS[status] || '';
      const note = status === 'disabled'
        ? (item.adminDisableReason || '')
        : (status === 'rejected' ? (item.rejectReason || '') : '');

      let actions = '<span class="store-action-muted">--</span>';
      if (status === 'approved') {
        actions = '<button class="btn btn-danger btn-sm" data-id="' + PetAdmin.escapeHtml(item.store_id) + '" data-action="disable">关闭</button>';
      } else if (status === 'disabled') {
        actions = '<button class="btn btn-primary btn-sm" data-id="' + PetAdmin.escapeHtml(item.store_id) + '" data-action="enable">重新开通</button>';
      }

      return [
        '<tr>',
        '<td><strong>' + PetAdmin.escapeHtml(item.name || '未命名店铺') + '</strong>',
        '<div class="store-sub">' + PetAdmin.escapeHtml(item.displayNo || item.store_id || '--') + '</div>',
        note ? '<div class="store-note">' + PetAdmin.escapeHtml(note) + '</div>' : '',
        '</td>',
        '<td>' + PetAdmin.escapeHtml(item.legalName || item.applicantName || '--') + '</td>',
        '<td>' + PetAdmin.escapeHtml(item.contactPhone || item.applicantPhone || '--') + '</td>',
        '<td><span class="store-status ' + statusClass + '">' + PetAdmin.escapeHtml(statusLabel) + '</span></td>',
        '<td>' + PetAdmin.escapeHtml(item.businessStatus || '--') + '</td>',
        '<td>' + PetAdmin.escapeHtml(item.updateTimeText || '--') + '</td>',
        '<td class="store-actions">' + actions + '</td>',
        '</tr>'
      ].join('');
    }

    async function loadStores() {
      contentEl.innerHTML = '<div class="card admin-loading">加载中...</div>';
      summaryEl.textContent = '';

      const params = new URLSearchParams();
      const status = statusFilterEl.value;
      const keyword = keywordInputEl.value.trim();
      if (status) params.set('status', status);
      if (keyword) params.set('keyword', keyword);

      try {
        const query = params.toString();
        const data = await PetAdmin.api('/api/admin/stores' + (query ? '?' + query : ''));
        if (!data.success) throw new Error(data.errMsg || '加载失败');
        renderStores(data.stores || [], data.total || 0);
      } catch (err) {
        contentEl.innerHTML = '<div class="card admin-empty"><strong>加载失败</strong><span>' + PetAdmin.escapeHtml(err.message) + '</span></div>';
      }
    }

    async function updateAccess(storeId, action, reason) {
      processingId = storeId;
      contentEl.querySelectorAll('button').forEach(function (btn) {
        btn.disabled = true;
      });

      try {
        const data = await PetAdmin.api('/api/admin/stores/access', {
          method: 'POST',
          body: JSON.stringify({
            store_id: storeId,
            action: action,
            reason: reason || ''
          })
        });
        if (!data.success) throw new Error(data.errMsg || '操作失败');
        alert(action === 'disable' ? '店铺已关闭' : '店铺已重新开通');
        await loadStores();
      } catch (err) {
        alert(err.message || '操作失败');
        contentEl.querySelectorAll('button').forEach(function (btn) {
          btn.disabled = false;
        });
      } finally {
        processingId = '';
      }
    }

    loadStores();
  </script>
</body>
</html>
